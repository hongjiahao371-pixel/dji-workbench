services:
  dji-workbench:
    build: .
    image: jvsheng/dji-workbench:latest
    container_name: dji-workbench
    ports:
      - "8920:8920"
    volumes:
      - ./data:/data                                  # 数据库/缩略图/代理缓存
      # 相机 SMB 自动上传的落盘目录（按 NAS 实际路径改）：
      - /volume1/media/DJI Device:/media/inbox
    environment:
      DJI_WB_DATA: /data
      DJI_WB_PORT: "8920"
      DJI_WB_HOST: 0.0.0.0        # 容器内必须绑 0.0.0.0，否则端口映射不通
      # 监听根=容器内视角；对应宿主机 /volume1/media/DJI Device
      DJI_WB_ROOTS: /media/inbox
    restart: unless-stopped
