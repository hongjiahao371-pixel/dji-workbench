services:
  dji-workbench:
    image: jvsheng/dji-workbench:upk-v1.0.0
    container_name: dji-workbench
    ports:
      - "8920:8920"
    volumes:
      - /volume1/@appdata/dji-workbench/data:/data
      - /volume1/@appdata/dji-workbench/inbox:/media/inbox
    environment:
      DJI_WB_DATA: /data
      DJI_WB_PORT: "8920"
      DJI_WB_HOST: 0.0.0.0
      TZ: Asia/Shanghai
      DJI_WB_ROOTS: /media/inbox
      DJI_WB_CONCAT_URL: "http://concat-engine:18190"
      AI_SEMANTIC_ENABLED: "false"
    restart: unless-stopped
  concat-engine:
    image: concat-engine:0.2.9
    container_name: concat-engine
    ports:
      - "18790:18790"
    volumes:
      - /volume1/@appdata/dji-workbench/inbox:/media/inbox
      - /volume1/@appdata/dji-workbench/concat:/opt/concat-home
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
