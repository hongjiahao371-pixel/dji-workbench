id: com.jvsheng.djiworkbench
name: DJI 素材工作台
chinese_name: DJI 素材工作台
description: 面向 DJI Osmo Pocket 4 Pro / Action 6 等 SMB 直传相机的素材工作台：自动入库、挑选（星级/色标/连拍堆叠/自动选片）、LUT 调色工作台、语义搜索（NAS 本机 AI）、OpenCut 精剪、导出与幻灯片。
description_en: Media workbench for DJI cameras with SMB auto-upload: auto ingest, culling (ratings/colors/burst stacking/auto pick), LUT grading workspace, semantic search (on-NAS AI), OpenCut fine editing, export and slideshows.
